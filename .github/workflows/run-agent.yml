name: Run Agent (cloud)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task per l'agente"
        required: true
        default: "Spiega in modo semplice cos'e' il cloud computing e i suoi vantaggi."
      mode:
        description: "Modalita': pipeline | parallel | handoff"
        required: false
        default: "pipeline"
      provider:
        description: "Provider LLM (vuoto = auto-detect)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Esegui agente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LLM_PROVIDER: ${{ github.event.inputs.provider }}
        run: |
          python main.py "${{ github.event.inputs.task }}" --mode "${{ github.event.inputs.mode }}"
      - name: Salva risultato come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultato-agente
          path: |
            memoria.json
            output/
          if-no-files-found: ignore
          retention-days: 30
